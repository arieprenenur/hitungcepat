<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tes Hitung Cepat</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      background-color: #0f172a; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center; text-align: center;
    }
    .card {
      background: #1e293b; padding: 30px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-width: 360px; width: 90%;
    }
    h2 { margin-top: 0; color: #38bdf8; font-size: 22px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .btn {
      display: block; background: #22c55e; color: white; padding: 14px 20px;
      text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px;
      transition: background 0.2s; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
    }
    .btn:hover { background: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tes Hitung Cepat</h2>
    <p>Silakan klik tombol di bawah untuk mulai masuk ke aplikasi tes perhitungan.</p>
    <a href="https://script.google.com/macros/s/AKfycbwIWLiOqAI5p4gHB0uAw89C5veLLGrT3gkwpvWj941h--7Q_kNFz8LSjhliSkauhA5V/exec" class="btn" target="_blank">Mulai Aplikasi Tes</a>
  </div>

  <script>
    // Daftarkan Service Worker untuk PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('PWA Service Worker Aktif!'))
          .catch(err => console.log('PWA Gagal:', err));
      });
    }
  </script>
</body>
</html>
